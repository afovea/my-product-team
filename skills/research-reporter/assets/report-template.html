/* Layout: one reading column, sticky section bar and findings filter, summary before detail, session materials folded away. */

  --pass: #64CF95; --pass-soft: #163024; --minor: #F2B458; --minor-soft: #352812;
  --major: #FF8E84; --major-soft: #3B1B1B; --inv: #B8BBDB; --inv-soft: #24273B; --frame: #3A3F58;
  --q1: #C9443B; --q1-on: #FFFFFF; --q2: #6B3330; --q2-on: #F8DCD9; --q3: #3A3E55; --q3-on: #E8EAF4;
  --q4: #24583D; --q4-on: #DDF4E6; --q5: #4CC383; --q5-on: #0E2117;

:root[data-theme="dark"] {
  --bg: #11131D; --surface: #1A1D2B; --ink: #E8EAF4; --muted: #A1A5BD; --line: #2D3146;

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--f-body); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.btn:hover { background: var(--bg); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }

/* Hero */
.hero { background: var(--surface); border-bottom: 1px solid var(--line); }
.hero .wrap { padding-block: 7px 32px; display: grid; gap: 22px; }
.brand { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 36px; padding-right: 46px; margin-bottom: 10px; }
/* Theme button: pinned top right; lines up with the section bar's actions once the bar sticks. */
.theme-dock { position: sticky; top: env(safe-area-inset-top, 0px); height: 0; z-index: 7; pointer-events: none; }
.theme-dock .wrap { display: flex; justify-content: flex-end; padding-top: 7px; }
.theme-dock .icon-btn { pointer-events: auto; }

.logo { font: 700 18px/1 var(--f-display); letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }

.logo .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-block; flex: none; }

.secbar .links a:hover { background: var(--bg); color: var(--ink); }

.secbar .actions .btn { height: 36px; padding-block: 0; }
.filterbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h, 51px)); z-index: 5; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.filterbar .wrap { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding-block: 9px; }

.sec-head .row { display: flex; justify-content: space-between; align-items: end; gap: 10px; flex-wrap: wrap; }

/* Pills */

.major { color: var(--major); background: var(--major-soft); }

.acc { color: var(--accent); background: var(--accent-soft); }

/* How to read */

/* Summary */
.insights { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }

.insights li strong { font: 600 16.5px/1.35 var(--f-display); }
.insights li p { color: var(--muted); font-size: 14px; }
.table-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 680px; font-size: 14px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }

.task-body.solo { grid-template-columns: 1fr; }
.empty { color: var(--muted); font-style: italic; list-style: none; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 14px 18px; }
.survey { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; }

.answers, .rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13.5px; }

.ovr { display: flex; align-items: center; gap: 4px; margin-top: 4px; font: 500 11px/1.2 var(--f-mono); color: var(--minor); white-space: nowrap; cursor: help; }
.ovr svg.i { font-size: 12px; }
.ease-cell { display: flex; align-items: center; gap: 10px; }
.ease-cell .seqbar { width: 96px; height: 12px; }

/* Fixes */
.fixes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

.fix .foot > span { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ev { font: 500 12px/1 var(--f-mono); text-decoration: none; padding: 4px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }

.hyp-head { display: grid; gap: 10px; padding: 22px 0 4px; border-top: 2px solid var(--ink); }

.measures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }

.measure:last-child { border-right: 0; }

.override b { color: var(--minor); }
.sevbar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--line); }

.seqbar i { display: grid; place-items: center; font: 600 12px/1 var(--f-mono); font-style: normal; min-width: 0; }
.seqbar .q1 { background: var(--q1); color: var(--q1-on); } .seqbar .q2 { background: var(--q2); color: var(--q2-on); }
.seqbar .q3 { background: var(--q3); color: var(--q3-on); } .seqbar .q4 { background: var(--q4); color: var(--q4-on); }
.seqbar .q5 { background: var(--q5); color: var(--q5-on); }
.seq-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.seq-sum { font-size: 12.5px; color: var(--muted); }
.seq-sum b { color: var(--ink); font-weight: 600; }
@media (max-width: 760px) {
  .measures { grid-template-columns: 1fr; }
  .measure { border-right: 0; border-bottom: 1px solid var(--line); }
  .measure:last-child { border-bottom: 0; }
}

.task-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }

.col-title { font: 500 11px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
.col-title svg.i { font-size: 14px; }
.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.finding { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; padding: 10px 8px 10px 8px; border-radius: 10px; scroll-margin-top: 130px; }
.finding .ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; }

.who svg.i { font-size: 13px; }
.pid { font: 500 11px/1 var(--f-mono); padding: 3px 5px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
button.pid { cursor: pointer; padding: 4px 6px; }
button.pid[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.copy { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; opacity: 0; font-size: 14px; display: grid; align-self: start; }
.finding:hover .copy, .copy:focus-visible { opacity: 1; }
@media (hover: none) { .copy { opacity: 0.7; } }
.finding.flash { animation: flash 2.2s ease-out; }
@keyframes flash { 0%, 40% { background: var(--accent-soft); } 100% { background: transparent; } }
.none-msg { font-size: 13.5px; color: var(--muted); font-style: italic; }
.quotes { display: grid; gap: 10px; margin-top: 18px; }
blockquote { margin: 0; padding: 12px 14px; background: var(--accent-soft); border-radius: 10px; display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; }
blockquote .qmark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--surface); display: grid; place-items: center; font-size: 16px; }

<script id="page-script">
(() => {
  const DATA_EL = document.getElementById('study-data');
  const ORIGINAL = DATA_EL.textContent;
  let state = JSON.parse(ORIGINAL);
  // session = an edit session is open (edit bar shown); editing = edit controls shown (false while previewing).
  let session = false, editing = false, dirty = false, filter = 'all', saving = false;
  let editAccess = null; // null | 'artifact' | 'local'
  let artifactApi = null, pendingRestore = null;
  const app = document.getElementById('app');

  // ---------- helpers ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = id => String(id).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const icon = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const get = p => p.split('.').reduce((o, k) => o == null ? o : o[k], state);
  const set = (p, v) => { const ks = p.split('.'), last = ks.pop(); ks.reduce((o, k) => o[k], state)[last] = v; };
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fmtDate = (d, opts) => { const t = new Date(d + 'T12:00:00'); return isNaN(t) ? d : t.toLocaleDateString('en-GB', opts); };
  const docTitle = () => `${state.study.title} · ${fmtDate(state.study.date, { day: 'numeric', month: 'short', year: 'numeric' })}`;

  // Editable text: E() for the main copy of a field, M() for read-only mirrors elsewhere on the page.
  const E = (path, tag = 'span', cls = '') => `<${tag}${cls ? ` class="${cls}"` : ''} data-edit="${path}"${editing ? ' contenteditable="plaintext-only" spellcheck="true"' : ''}>${esc(get(path))}</${tag}>`;
  const M = path => `<span data-mirror="${path}">${esc(get(path))}</span>`;
  const addBtn = (path, tpl, label) => editing ? `<button type="button" class="add" data-add="${path}" data-tpl="${tpl}">${icon('plus')}${esc(label)}</button>` : '';
  const delBtn = (path, label, cls = '') => editing ? `<button type="button" class="del ${cls}" data-del="${path}" aria-label="Remove ${esc(label)}" title="Remove ${esc(label)}">${icon('trash')}</button>` : '';
  const sel = (path, options, value, label, kind = 'str') => `<select class="ed-select" data-set="${path}" data-kind="${kind}" aria-label="${esc(label)}">${options.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(value) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;

  const FT = {
    major: { label: 'Major issue', cls: 'major', icon: 'cross', rank: 0 },
    minor: { label: 'Minor issue', cls: 'minor', icon: 'alert', rank: 1 },
    investigate: { label: 'Needs investigation', cls: 'inv', icon: 'search', rank: 2 },
    positive: { label: 'Worked well', cls: 'pass', icon: 'check', rank: 3 }
  };
  const VERDICT = { pass: { label: 'Pass', cls: 'pass', icon: 'check' }, fail: { label: 'Fail', cls: 'major', icon: 'cross' }, na: { label: 'Not scored', cls: 'quiet', icon: 'clock' } };
  const EFF = { none: { label: 'No issues', cls: 'pass', icon: 'check' }, minor: { label: 'Minor issues', cls: 'minor', icon: 'alert' }, major: { label: 'Major issues', cls: 'major', icon: 'cross' }, na: { label: 'Not rated', cls: 'quiet', icon: 'clock' } };
  // Task groups are hypotheses by default; a study can group by something else (study.groupLabel, e.g. "Area").
  const groupLabel = () => state.study.groupLabel || 'Hypothesis';
  const isHyp = () => groupLabel() === 'Hypothesis';
  const HYPS = {
    supported: { label: 'Supported', cls: 'pass', icon: 'check' }, partly: { label: 'Partly supported', cls: 'minor', icon: 'alert' }, not: { label: 'Not supported', cls: 'major', icon: 'cross' }, na: { label: 'Not scored', cls: 'quiet', icon: 'clock' }
  };
  const AREAS = {
    supported: { label: 'All tasks passed', cls: 'pass', icon: 'check' }, partly: { label: 'Some tasks passed', cls: 'minor', icon: 'alert' }, not: { label: 'No tasks passed', cls: 'major', icon: 'cross' }, na: { label: 'Not scored', cls: 'quiet', icon: 'clock' }
  };
  const HYP = new Proxy({}, { get: (_, k) => (isHyp() ? HYPS : AREAS)[k] });
  // A 7-point scale is the Single Ease Question; anything else is labelled by its range so it is never mistaken for it.
  const easeLabel = () => state.study.easeLabel || (state.study.seqScale === 7 ? 'Ease (SEQ)' : `Ease (1–${state.study.seqScale})`);
  const fmtMs = ms => { if (ms == null) return '–'; const s = Math.round(ms / 1000); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`; };
  const PRIO = { High: 'major', Medium: 'minor', Low: 'quiet', Investigate: 'inv' };
  const pill = (m, sm) => `<span class="pill ${m.cls}${sm ? ' sm' : ''}">${icon(m.icon)}${esc(m.label)}</span>`;

  // ---------- scoring ----------
  // Pass = more than half completed (3/5, 4/7), matching the original template's guide.
  // Efficiency = the worst severity that 2+ participants hit.
  // A task with "scored": false (e.g. an observation task not yet coded) never passes or fails.
  // A result with done: null is waiting for review and is left out of the completion count.
  // sev and ms are optional: no sev means efficiency is "Not rated"; ms adds a median time.
  function score(t) {
    const all = Object.values(t.results || {}), scale = state.study.seqScale, scored = t.scored !== false;
    const r = all.filter(x => typeof x.done === 'boolean'), n = r.length, pending = all.length - n;
    const done = r.filter(x => x.done).length;
    const computed = !scored ? 'na' : n && done * 2 > n ? 'pass' : 'fail';
    const verdict = scored ? (t.override?.verdict || computed) : 'na';
    const sev = { none: 0, minor: 0, major: 0 };
    all.forEach(x => { if (x.sev in sev) sev[x.sev]++; });
    const rated = sev.none + sev.minor + sev.major;
    const eff = !rated ? 'na' : sev.major >= 2 ? 'major' : (sev.minor + sev.major) >= 2 ? 'minor' : 'none';
    const seqs = all.map(x => Number(x.seq)).filter(Boolean);
    const seqMean = seqs.length ? seqs.reduce((a, b) => a + b, 0) / seqs.length : NaN;
    const dist = Array.from({ length: scale }, (_, i) => seqs.filter(s => s === i + 1).length);
    const times = all.map(x => x.ms).filter(v => v > 0).sort((a, b) => a - b), m = times.length >> 1;
    const medianMs = times.length ? (times.length % 2 ? times[m] : (times[m - 1] + times[m]) / 2) : null;
    return { n, done, pending, total: all.length, scored, computed, verdict, overridden: verdict !== computed, sev, rated, eff, seqMean, dist, seqs, medianMs };
  }
  const hypVerdict = scores => {
    const sc = scores.filter(s => s.scored); if (!sc.length) return 'na';
    const p = sc.filter(s => s.verdict === 'pass').length; return p === sc.length ? 'supported' : p === 0 ? 'not' : 'partly';
  };
  const fmtMean = m => isNaN(m) ? '–' : m.toFixed(1);

  // ---------- ease (SEQ) bar ----------
  // One stacked bar from difficult (red) to easy (green), counts printed in each band.
  function seqBar(s, compact) {
    const scale = state.study.seqScale, labels = state.study.seqLabels || [];
    const band = i => 'q' + (Math.round(i * 4 / (scale - 1)) + 1);
    const segs = s.dist.map((c, i) => c ? `<i class="${band(i)}" style="flex:${c}" title="${c} × ${esc(labels[i] || i + 1)}">${compact ? '' : c}</i>` : '').join('');
    return `<div class="seqbar" role="img" aria-label="Ease ratings: ${s.dist.map((c, i) => `${c} ${labels[i] || i + 1}`).join(', ')}">${segs}</div>`;
  }
  function seqSummary(s) {
    const scale = state.study.seqScale, mid = (scale + 1) / 2;
    const easy = s.seqs.filter(v => v > mid).length, hard = s.seqs.filter(v => v < mid).length, neutral = s.seqs.length - easy - hard;
    return `<p class="seq-sum"><b>${easy}</b> found it easy · <b>${neutral}</b> neutral · <b>${hard}</b> found it difficult</p>`;
  }

  // ---------- wireframes ----------
  function block(x, y, w, h, b) {
    const tone = b.tone || 'plain';
    let o = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" class="blk-${tone}"/>`;
    if (tone === 'btn') return o + `<text x="${x + w / 2}" y="${y + h / 2 + 3.5}" text-anchor="middle" class="blk-bt">${esc(b.label)}</text>`;
    o += `<text x="${x + 9}" y="${y + 15}" class="blk-t">${esc(b.label)}</text>`;
    if (b.sub) o += `<text x="${x + 9}" y="${y + 28}" class="blk-s">${esc(b.sub)}</text>`;
    if (b.chart) {
      const max = Math.max(...b.chart), top = y + 26, base = y + h - (b.axis ? 14 : 8), cw = (w - 18) / b.chart.length, pk = b.chart.indexOf(max);
      b.chart.forEach((v, i) => {
        const bh = (base - top) * v / max, bx = x + 9 + i * cw + 2;
        o += `<rect x="${bx}" y="${base - bh}" width="${Math.max(2, cw - 5)}" height="${bh}" rx="2" class="${b.peak && i === pk ? 'bar-p' : 'bar-m'}"/>`;
      });
      if (b.peak) o += `<text x="${x + 9 + pk * cw + cw / 2 - 0.5}" y="${top - 2}" text-anchor="middle" class="bar-l">PEAK</text>`;
      if (b.axis) o += `<text x="${x + 9}" y="${base + 10}" class="blk-s">${esc(b.axis)}</text>`;
    }
    if (b.progress != null) {
      o += `<rect x="${x + 9}" y="${y + h - 14}" width="${w - 18}" height="6" rx="3" class="prog-bg"/>`;
      o += `<rect x="${x + 9}" y="${y + h - 14}" width="${(w - 18) * Math.min(1, b.progress)}" height="6" rx="3" class="prog-fg"/>`;
    }
    return o;
  }
  function phone(spec, aria) {
    let y = 50, o = `<rect x="1" y="1" width="178" height="358" rx="24" class="ph-body"/><rect x="8" y="8" width="164" height="344" rx="17" class="ph-screen"/><rect x="70" y="15" width="40" height="5" rx="2.5" class="ph-status"/><text x="20" y="40" class="ph-title">${esc(spec.title)}</text>`;
    for (const b of spec.blocks || []) { o += block(18, y, 144, b.h, b); y += b.h + 8; }
    return `<svg class="phone" viewBox="0 0 180 360" role="img" aria-label="${esc(aria)}">${o}</svg>`;
  }
  function desktop(spec, aria) {
    let o = `<rect x="1" y="1" width="358" height="238" rx="10" class="ph-body"/>`;
    o += [12, 21, 30].map(cx => `<circle cx="${cx}" cy="10" r="2.6" class="ph-status"/>`).join('');
    o += `<rect x="44" y="4.5" width="200" height="11" rx="5.5" class="ph-screen"/><text x="52" y="12.4" class="url-t">${esc(spec.url || '')}</text>`;
    o += `<rect x="4" y="19" width="352" height="217" rx="6" class="ph-screen"/><rect x="4" y="19" width="72" height="217" rx="6" class="ph-side"/>`;
    o += `<rect x="12" y="27" width="10" height="10" rx="3" class="bar-p"/>`;
    (spec.nav || []).forEach((n, i) => {
      const ny = 52 + i * 17;
      if (i === spec.active) o += `<rect x="8" y="${ny - 10}" width="64" height="15" rx="4" class="nav-a"/>`;
      o += `<text x="14" y="${ny}" class="${i === spec.active ? 'nav-ta' : 'nav-t'}">${esc(n)}</text>`;
    });
    o += `<text x="86" y="38" class="ph-title">${esc(spec.title)}</text>`;
    const X = 86, W = 262, cw = (W - 8) / 2;
    let y = 48, pending = null;
    for (const b of spec.blocks || []) {
      if (b.span === 2) {
        if (pending != null) { y += pending + 8; pending = null; }
        o += block(X, y, W, b.h, b); y += b.h + 8;
      } else if (pending == null) { o += block(X, y, cw, b.h, b); pending = b.h; }
      else { o += block(X + cw + 8, y, cw, b.h, b); y += Math.max(pending, b.h) + 8; pending = null; }
    }
    return `<svg class="desk" viewBox="0 0 360 240" role="img" aria-label="${esc(aria)}">${o}</svg>`;
  }
  const screen = (spec, device, aria) => spec?.src ? `<img src="${esc(spec.src)}" alt="${esc(aria)}">` : device === 'desktop' ? desktop(spec || {}, aria) : phone(spec || {}, aria);

  // ---------- small renderers ----------
  const P = () => state.participants;
  const N = () => state.participants.length;
  // Completion is shown as plain numbers: reads the same for 5 or 500 participants.
  const CHIPS = 8;
  const verdictCell = (s, t) => `${pill(VERDICT[s.verdict], true)}${s.overridden ? `<span class="ovr" title="${esc(t.override.reason)}">${icon('user')}Researcher call</span>` : ''}`;
  const doneLabel = s => !s.scored ? '<span class="muted">–</span>' : `<span class="done"><b>${s.done}/${s.n}</b><span>${pct(s.done, s.n)}%</span></span>${s.pending ? `<span class="ovr" style="color:var(--muted)">${s.pending} to review</span>` : ''}`;
  // Participant fields are study-specific: study.participantFields [{key, label}], else every key except id.
  const pFields = () => state.participantFields || Object.keys(P()[0] || {}).filter(k => k !== 'id').map(k => ({ key: k, label: k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()) }));
  const pSummary = p => pFields().slice(0, 2).map(f => p[f.key]).filter(Boolean).join(', ');
  const who = ids => `<span class="who">${icon('users')}<span class="num">${ids.length} of ${N()}</span>${ids.map((id, i) => `<span class="pid"${i >= CHIPS ? ' hidden' : ''}>${esc(id)}</span>`).join('')}${ids.length > CHIPS ? `<button type="button" class="pid more" data-more aria-label="Show all ${ids.length} participants">+${ids.length - CHIPS} more</button>` : ''}</span>`;
  const whoEd = (fp, ids) => `<span class="who">${icon('users')}${P().map(p => `<button type="button" class="pid" data-who="${fp}" data-pid="${esc(p.id)}" aria-pressed="${ids.includes(p.id)}">${esc(p.id)}</button>`).join('')}</span>`;
  const findTask = fid => { for (const h of state.hypotheses) for (const t of h.tasks) if ((t.findings || []).some(f => f.id === fid)) return t; return null; };

  function taskHTML(h, hi, t, ti) {
    const s = score(t), tp = `hypotheses.${hi}.tasks.${ti}`, a = slug(t.id), dev = t.screens?.device === 'desktop' ? 'desktop' : 'mobile';
    const sevSeg = ['none', 'minor', 'major'].map(k => s.sev[k] ? `<i class="s-${k}" style="width:${pct(s.sev[k], s.rated)}%"></i>` : '').join('');
    const hasScreens = !!t.screens;
    const labels = state.study.seqLabels || [];
    const sorted = (t.findings || []).map((f, fi) => ({ f, fi })).sort((x, y) => (FT[x.f.type]?.rank ?? 9) - (FT[y.f.type]?.rank ?? 9) || y.f.who.length - x.f.who.length);
    const findings = sorted.map(({ f, fi }) => {
      const m = FT[f.type] || FT.minor, fp = `${tp}.findings.${fi}`;
      return `<li class="finding" id="${slug(f.id)}" data-type="${f.type}">
        <span class="ico ${m.cls}">${icon(m.icon)}</span>
        <div class="txt">
          <div class="ftop">${editing ? sel(fp + '.type', Object.entries(FT).map(([k, v]) => [k, v.label]), f.type, 'Finding type') : `<span class="ftype" style="color:var(--${m.cls})">${m.label}</span>`}<span class="fid">${esc(f.id)}</span></div>
          ${E(fp + '.text', 'p')}
          ${editing ? whoEd(fp, f.who) : who(f.who)}
        </div>
        ${editing ? delBtn(fp, 'finding') : `<button type="button" class="copy" data-copy="${slug(f.id)}" aria-label="Copy link to finding ${esc(f.id)}" title="Copy link">${icon('link')}</button>`}
      </li>`;
    }).join('');
    const quotes = (t.quotes || []).map((q, qi) => {
      const qp = `${tp}.quotes.${qi}`, p = P().find(p => p.id === q.who);
      return `<blockquote>
        <span class="qmark">${icon('quote')}</span>
        <div class="qbody"><p>“${E(qp + '.text')}”</p>
          <footer>${editing ? sel(qp + '.who', P().map(p => [p.id, p.id]), q.who, 'Who said this') : `<span class="pid">${esc(q.who)}</span>`}${p && pSummary(p) ? `<span>${esc(pSummary(p))}</span>` : ''}</footer></div>
        ${delBtn(qp, 'quote')}
      </blockquote>`;
    }).join('');
    const shot = (v, label) => {
      const spec = t.screens?.[v] || {}, sp = `${tp}.screens.${v}`;
      return `<figure class="shot" data-v="${v}" ${v === 'asIs' && !editing ? 'hidden' : ''}>
        ${editing ? `<span class="eyebrow">${label}</span>` : ''}
        ${screen(spec, dev, `${label}: ${spec.caption || ''}`)}
        <figcaption>${E(sp + '.caption')}</figcaption>
        ${editing ? `<div class="img-ed"><label class="btn">${icon('image')}Replace with screenshot<input type="file" accept="image/*" data-img="${sp}"></label>${spec.src ? `<button type="button" class="btn" data-unimg="${sp}">Remove screenshot</button>` : ''}</div>` : ''}
      </figure>`;
    };
    const resultsEd = editing ? `<div class="results-ed">
        <div class="col-title" style="margin:0">${icon('pencil')}Results per participant</div>
        <div class="table-box"><table><thead><tr><th>Participant</th><th>Completed</th><th>Friction</th><th>Ease (1–${state.study.seqScale})</th></tr></thead><tbody>
        ${P().map(p => { const r = t.results[p.id] || {}; const rp = `${tp}.results.${p.id}`; return `<tr><td><span class="pid">${esc(p.id)}</span></td>
          <td><input type="checkbox" data-set="${rp}.done" data-kind="bool" ${r.done ? 'checked' : ''} aria-label="${esc(p.id)} completed"></td>
          <td>${sel(rp + '.sev', [['none', 'No issue'], ['minor', 'Minor'], ['major', 'Major']], r.sev || 'none', p.id + ' friction')}</td>
          <td>${sel(rp + '.seq', Array.from({ length: state.study.seqScale }, (_, i) => [i + 1, `${i + 1} · ${labels[i] || ''}`]), r.seq || '', p.id + ' ease', 'num')}</td></tr>`; }).join('')}
        </tbody></table></div>
        <label class="ov"><input type="checkbox" data-set="${tp}.scored" data-kind="bool" ${s.scored ? 'checked' : ''}> Score this task as pass or fail</label>
        ${!s.scored ? '' : `<div class="ov"><span>Verdict</span>${`<select class="ed-select" data-override="${tp}" aria-label="Verdict">${[['', `Calculated (${s.computed === 'pass' ? 'Pass' : 'Fail'})`], ['pass', 'Researcher call: Pass'], ['fail', 'Researcher call: Fail']].map(([v, l]) => `<option value="${v}"${(t.override?.verdict || '') === v ? ' selected' : ''}>${l}</option>`).join('')}</select>`}
          ${t.override ? `<input class="ed-input" data-set="${tp}.override.reason" value="${esc(t.override.reason)}" placeholder="Why is this different from the calculated verdict?" aria-label="Reason for verdict">` : ''}</div>`}
      </div>` : '';
    return `<article class="task" id="${a}">
      <header class="task-head">
        <div class="row"><span class="eyebrow">${esc(h.id)} · Task ${esc(t.id.replace(/^T/, ''))}</span>
          <span class="ed-row"><span class="stim">${icon(dev === 'desktop' ? 'monitor' : 'phone')}${E(tp + '.stimulus')}</span>${editing && hasScreens ? sel(tp + '.screens.device', [['mobile', 'Mobile'], ['desktop', 'Desktop']], dev, 'Device') : ''}${delBtn(tp, 'task ' + t.id)}</span></div>
        ${E(tp + '.title', 'h3')}
        ${(t.tags || []).length ? `<div class="tags">${t.tags.map(x => `<span class="tag-chip">${esc(x)}</span>`).join('')}</div>` : ''}
      </header>
      <div class="measures">
        <div class="measure">
          <div class="top"><span class="eyebrow">${icon('target')}Effectiveness</span>${pill(VERDICT[s.verdict], true)}</div>
          ${s.scored
            ? `<div class="big num">${s.done}<small> of ${s.n} completed · ${pct(s.done, s.n)}%</small></div>
               ${s.overridden ? `<p class="override"><b>Researcher call:</b> ${esc(t.override.reason)}</p>` : `<p class="def">Pass when more than half complete the task.${s.pending ? ` ${s.pending} result${s.pending === 1 ? '' : 's'} still to review.` : ''}</p>`}`
            : `<p class="def">${esc(t.scoreNote || 'Observation task: responses need coding before it can pass or fail.')}</p>`}
        </div>
        <div class="measure">
          <div class="top"><span class="eyebrow">${icon('gauge')}Efficiency</span>${pill(EFF[s.eff], true)}</div>
          ${s.rated ? `<div class="sevbar" role="img" aria-label="${s.sev.none} no issue, ${s.sev.minor} minor, ${s.sev.major} major">${sevSeg}</div>
          <div class="sevkey num"><span class="k-none">${s.sev.none} no issue</span><span class="k-minor">${s.sev.minor} minor</span><span class="k-major">${s.sev.major} major</span></div>` : ''}
          ${s.medianMs != null ? `<div class="big num">${fmtMs(s.medianMs)}<small> median time</small></div>` : ''}
          <p class="def">${s.rated ? esc(t.effNote || 'How much friction each participant hit.') : 'Friction not rated for this task.'}</p>
        </div>
        <div class="measure">
          ${t.easeAsked === false ? `<div class="top"><span class="eyebrow">${icon('smile')}${esc(easeLabel())}</span></div>
          <p class="def">Not asked for this task.</p>` : `<div class="top"><span class="eyebrow">${icon('smile')}${esc(easeLabel())}</span><span class="big num">${fmtMean(s.seqMean)}<small> / ${state.study.seqScale} avg</small></span></div>
          ${seqBar(s)}
          <div class="seq-ends"><span>${esc(labels[0] || 'Difficult')}</span><span>${esc(labels[labels.length - 1] || 'Easy')}</span></div>
          ${seqSummary(s)}`}
        </div>
      </div>
      ${resultsEd}
      <div class="task-body ${hasScreens ? dev : 'solo'}">
        <div>
          <div class="col-title">${icon('layers')}Findings</div>
          <ul class="findings">${findings}</ul>
          <p class="none-msg" hidden>No findings of this type for this task.</p>
          ${addBtn(tp + '.findings', 'finding', 'Add finding')}
          ${(quotes || editing) ? `<div class="quotes"><div class="col-title" style="margin:0">${icon('quote')}In their words</div>${quotes}${addBtn(tp + '.quotes', 'quote', 'Add quote')}</div>` : ''}
        </div>
        ${!hasScreens ? (editing ? `<div class="screens"><button type="button" class="add" data-screens="${tp}">${icon('image')}Add screens</button></div>` : '') : `<div class="screens">
          <div class="bar">
            ${editing ? `<span class="eyebrow">${icon(dev === 'desktop' ? 'monitor' : 'phone')}Screens</span>` : `<div class="seg" role="group" aria-label="Screen version">
              <button type="button" data-shot="asIs" aria-pressed="false">As is</button>
              <button type="button" data-shot="toBe" aria-pressed="true">To be</button>
            </div>`}

          </div>
          ${shot('asIs', 'As is')}${shot('toBe', 'To be')}
          <div class="legend"><span class="l-hot">Where people struggled</span><span class="l-new">Proposed change</span></div>
        </div>`}
      </div>
      ${(t.takeaway || []).length || editing ? `<div class="takeaway"><span class="col-title" style="margin:0">${icon('pin')}Takeaway</span>
        <ul>${(t.takeaway || []).map((x, i) => `<li>${E(`${tp}.takeaway.${i}`)} ${delBtn(`${tp}.takeaway.${i}`, 'point')}</li>`).join('')}</ul>
        ${addBtn(tp + '.takeaway', 'string', 'Add point')}
      </div>` : ''}
      <details class="materials"${editing ? ' open' : ''}${!editing && !(t.script || []).length && !(t.lookFor || []).length ? ' hidden' : ''}>
        <summary><span class="chev">${icon('chev')}</span>${icon('clipboard')}Session materials: script and what we watched for</summary>
        <div class="inner">
          <div><div class="col-title">Testing script</div><ol class="script">${(t.script || []).map((x, i) => `<li>${E(`${tp}.script.${i}`)}${delBtn(`${tp}.script.${i}`, 'script line')}</li>`).join('')}</ol>${addBtn(tp + '.script', 'string', 'Add line')}</div>
          <div><div class="col-title">What we watched for</div><ul class="look">${(t.lookFor || []).map((l, i) => {
            const lp = `${tp}.lookFor.${i}`;
            const no = l.observed === false; // null/undefined = not recorded either way
            return `<li class="${no ? 'no' : ''}"><span class="eye">${icon(no ? 'eyeoff' : 'eye')}</span><span class="txt">${E(lp + '.text')}${editing ? ` <label class="tag"><input type="checkbox" data-set="${lp}.observed" data-kind="bool" ${l.observed ? 'checked' : ''}> observed</label>` : no ? '<span class="tag">not observed</span>' : ''}</span>${delBtn(lp, 'item')}</li>`;
          }).join('')}</ul>${addBtn(tp + '.lookFor', 'look', 'Add item')}</div>
        </div>
      </details>
    </article>`;
  }

  // ---------- full render ----------
  function render() {
    // Older reports had one "author" field: it becomes "Authored by".
    if (state.study.author != null && state.study.authoredBy == null) { state.study.authoredBy = state.study.author; delete state.study.author; }
    const S = state.study, hyps = state.hypotheses;
    const credit = (key, label) => `<div><dt>${label}</dt><dd>${editing || S[key] ? E('study.' + key) : '<span class="muted">Not set</span>'}</dd></div>`;
    const scored = hyps.map(h => h.tasks.map(score));
    const verdicts = scored.map(hypVerdict);
    const all = scored.flat();
    const allSeq = all.flatMap(s => s.seqs);
    const allFindings = hyps.flatMap(h => h.tasks.flatMap(t => t.findings || []));
    const counts = Object.fromEntries(Object.keys(FT).map(k => [k, allFindings.filter(f => f.type === k).length]));
    const ease = allSeq.length ? allSeq.reduce((a, b) => a + b, 0) / allSeq.length : NaN;
    document.title = docTitle();

    const scoreRows = hyps.map((h, hi) => `
      <tr class="hyp-row"><td colspan="5"><div class="row-flex"><a class="task-link" href="#${slug(h.id)}">${h.id !== h.statement ? `<span class="tid">${esc(h.id)}</span>` : ''}${M(`hypotheses.${hi}.statement`)}</a>${pill(HYP[verdicts[hi]], true)}</div></td></tr>
      ${h.tasks.map((t, ti) => { const s = scored[hi][ti]; return `<tr>
        <td><a class="task-link" href="#${slug(t.id)}"><span class="tid">${esc(t.id)}</span>${M(`hypotheses.${hi}.tasks.${ti}.title`)}</a></td>
        <td>${verdictCell(s, t)}</td>
        <td class="num">${doneLabel(s)}</td>
        <td>${pill(EFF[s.eff], true)}</td>
        <td>${t.easeAsked === false ? '<span class="muted">Not asked</span>' : `<div class="ease-cell">${seqBar(s, true)}<span class="num">${fmtMean(s.seqMean)}</span></div>`}</td>
      </tr>`; }).join('')}`).join('');

    const scoredTasks = all.filter(s => s.scored);
    const recs = !state.recommendations.length && !editing ? `<li class="empty">No recommendations yet. Add them in edit mode once the team has reviewed the findings.</li>` : state.recommendations.map((r, ri) => {
      const rp = `recommendations.${ri}`;
      return `<li class="fix">
        <span class="prio">${editing ? sel(rp + '.priority', Object.keys(PRIO).map(k => [k, k]), r.priority, 'Priority') : `<span class="pill sm ${PRIO[r.priority] || 'quiet'}">${icon('flag')}${esc(r.priority)}</span>`}</span>
        ${E(rp + '.title', 'h3')}
        ${E(rp + '.detail', 'p')}
        <div class="foot"><span>${icon('user')}Owner: ${E(rp + '.owner', 'b', 'ink')}</span><span>${icon('clock')}Effort: ${editing ? sel(rp + '.effort', [['Small', 'Small'], ['Medium', 'Medium'], ['Large', 'Large']], r.effort, 'Effort') : esc(r.effort)}</span>
          <span>${icon('layers')}Evidence: ${editing ? `<input class="ed-input" data-set="${rp}.evidence" data-kind="list" value="${esc(r.evidence.join(', '))}" aria-label="Evidence finding IDs" placeholder="e.g. T2.1-F1, T2.1-F2">` : r.evidence.filter(findTask).map(id => `<a class="ev" href="#${slug(id)}">${esc(id)}</a>`).join('')}</span></div>
        ${delBtn(rp, 'recommendation', 'abs-del')}
      </li>`;
    }).join('');

    const hypSections = hyps.map((h, hi) => {
      const passed = scored[hi].filter(s => s.verdict === 'pass').length, nScored = scored[hi].filter(s => s.scored).length, unscored = h.tasks.length - nScored;
      return `<section id="${slug(h.id)}"><div class="wrap">
        <div class="hyp-head">
          <div class="row"><span class="eyebrow">${icon('target')}${esc(groupLabel())} ${hi + 1} of ${hyps.length}</span><span class="ed-row">${pill(HYP[verdicts[hi]])}${delBtn(`hypotheses.${hi}`, groupLabel().toLowerCase() + ' ' + h.id)}</span></div>
          ${E(`hypotheses.${hi}.statement`, 'h2')}
          ${h.note || editing ? E(`hypotheses.${hi}.note`, 'p', 'muted') : ''}
          <p class="muted">${nScored ? `${passed} of ${nScored} scored task${nScored === 1 ? '' : 's'} passed.` : 'No scored tasks yet.'}${unscored ? ` ${unscored} task${unscored === 1 ? '' : 's'} not scored.` : ''}</p>
        </div>
        ${h.tasks.map((t, ti) => taskHTML(h, hi, t, ti)).join('')}
        ${addBtn(`hypotheses.${hi}.tasks`, 'task', 'Add task to ' + h.id)}
      </div></section>`;
    }).join('');

    const fields = pFields();
    const ptable = `<div class="table-box"><table style="min-width:440px"><thead><tr><th>ID</th>${fields.map(f => `<th>${esc(f.label)}</th>`).join('')}${editing ? '<th></th>' : ''}</tr></thead><tbody>${P().map((p, pi) => `<tr><td><span class="pid">${esc(p.id)}</span></td>${fields.map(f => `<td>${E(`participants.${pi}.${f.key}`)}</td>`).join('')}${editing ? `<td>${delBtn(`participants.${pi}`, 'participant ' + p.id)}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;

    // Closing questions: choice answers as counts, rankings as average position.
    const survey = (state.survey || []).map((q, qi) => {
      const qp = `survey.${qi}`;
      if (q.kind === 'text') {
        return `<div class="card q"><span class="eyebrow">Written answers · ${q.n}</span>${E(qp + '.prompt', 'h3')}
          <ul class="answers-text">${q.answers.map(a => `<li>“${esc(a)}”</li>`).join('')}</ul></div>`;
      }
      if (q.kind === 'rank') {
        const items = [...q.items].sort((a, b) => a.avg - b.avg);
        return `<div class="card q"><span class="eyebrow">Ranking · ${q.n} answers</span>${E(qp + '.prompt', 'h3')}
          <ol class="rank">${items.map(it => `<li><span class="rk-label">${esc(it.label)}</span><span class="rk-meta num">avg position <b>${it.avg.toFixed(1)}</b> · ranked first by <b>${it.first}</b></span></li>`).join('')}</ol></div>`;
      }
      const max = Math.max(1, ...q.options.map(o => o.count));
      const comments = q.options.flatMap(o => (o.comments || []).map(c => ({ o: o.label, c })));
      return `<div class="card q"><span class="eyebrow">${q.n} answers</span>${E(qp + '.prompt', 'h3')}

    app.innerHTML = `

          <div class="card"><h3>${icon('clipboard')}Method</h3><ul>${S.methodDetail.map((x, i) => `<li>${E(`study.methodDetail.${i}`)} ${delBtn(`study.methodDetail.${i}`, 'method line')}</li>`).join('')}</ul>${addBtn('study.methodDetail', 'string', 'Add method line')}
            <h3>${icon('monitor')}Test materials</h3><ul>${S.stimulus.map((x, i) => editing
              ? `<li>${E(`study.stimulus.${i}.label`)}<br><input class="ed-input" style="width:100%" data-set="study.stimulus.${i}.url" value="${esc(x.url)}" aria-label="Link"> ${delBtn(`study.stimulus.${i}`, 'link')}</li>`
              : `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a></li>`).join('')}</ul>${addBtn('study.stimulus', 'link', 'Add link')}</div>
        </div>
        <div class="card"><h3>${icon('users')}Participants</h3>${ptable}${addBtn('participants', 'participant', 'Add participant')}</div>
        ${(S.scoringNotes || []).length ? `<div class="card"><h3>${icon('clipboard')}How this study's data was scored</h3><ul>${S.scoringNotes.map((x, i) => `<li>${E(`study.scoringNotes.${i}`)}</li>`).join('')}</ul></div>` : ''}
        <div class="card"><h3>${icon('book')}How we score</h3><ul class="key">
          <li>${pill(VERDICT.pass, true)}<span><b>Effectiveness.</b> A task passes when more than half of participants complete it (3 of 5, 4 of 7). The researcher can override this, with a written reason.</span></li>
          <li>${pill(EFF.minor, true)}<span><b>Efficiency.</b> Each participant is rated no issue, minor (completed with some difficulty) or major (significant difficulty or failure). The task shows the worst level that 2 or more people hit.</span></li>
          <li><span class="pill sm acc">${icon('smile')}${esc(easeLabel())}</span><span><b>Ease.</b> ${scale === 7 ? 'Single Ease Question, asked straight after each task: “Overall, how difficult or easy was the task to complete?” on its standard 7-point scale.' : `Asked straight after each task: “Overall, how easy or difficult was this task?” on a ${scale}-point scale. This is not the 7-point Single Ease Question, so it is not compared with its benchmarks.`} The bar runs from difficult (red) to easy (green), with the number of people in each band.</span></li>
          <li><span class="pill sm inv">${icon('search')}Investigate</span><span><b>Needs investigation.</b> Something we saw but can't yet explain or size. It needs more research before acting on it.</span></li>
        </ul></div>

    <footer class="end"><div class="wrap"><span>${M('study.brand')} · ${M('study.team')} · ${esc(fmtDate(S.date, { day: 'numeric', month: 'long', year: 'numeric' }))} · ${M('study.authoredBy')}</span><a class="totop" href="#top">${icon('up')}Back to top</a></div></footer>
    ${session ? `<div class="editbar"><div class="wrap">
      <span class="state${dirty ? ' dirty' : ''}"><span class="dot"></span>${saving ? 'Saving…' : dirty ? 'Unsaved changes' : 'No changes yet'}<span class="muted">· ${editing ? 'Click any outlined text to edit it' : 'Previewing as readers will see it'}</span></span>
      <span class="btns">
        <button type="button" class="btn" data-act="preview" aria-pressed="${!editing}">${editing ? `${icon('eye')}Preview` : `${icon('pencil')}Back to editing`}</button>
        ${editing ? `<button type="button" class="btn" data-act="json">${icon('braces')}Edit all data</button>` : ''}
        <button type="button" class="btn" data-act="discard"${dirty ? '' : ' hidden'}>${icon('undo')}Discard changes</button>
        <button type="button" class="btn primary" data-act="save" ${saving ? 'disabled' : ''} title="${editAccess === 'local' ? 'Saves an updated copy to your Downloads folder' : 'Saves your changes and stops editing'}">${icon('save')}Save</button>
      </span></div></div>` : ''}`;

    document.body.classList.toggle('editing', editing);
    document.body.classList.toggle('session', session);
    applyFilter();
    paintThemeBtn();
    measureBar();
  }

  // ---------- templates for new items ----------
  function template(kind, arrPath) {
    const scale = state.study.seqScale, P0 = P()[0]?.id || 'P1';
    const newTask = (hIndex, n) => ({
      id: `T${hIndex + 1}.${n + 1}`, title: 'New task', stimulus: 'Prototype · Screen', script: ['Task instruction'], lookFor: [{ text: 'What to look for', observed: true }],
      results: Object.fromEntries(P().map(p => [p.id, { done: true, sev: 'none', seq: Math.ceil(scale / 2) }])),
      findings: [], quotes: [],
      screens: { device: 'mobile', asIs: { title: 'Screen', caption: 'Current design', blocks: [{ label: 'Content', h: 60 }, { label: 'Problem area', h: 50, tone: 'hot' }] }, toBe: { title: 'Screen', caption: 'Proposed design', blocks: [{ label: 'Content', h: 60 }, { label: 'Proposed change', h: 50, tone: 'new' }] } },
      takeaway: ['Key point']
    });
    switch (kind) {
      case 'string': return 'New point';
      case 'insight': return { title: 'New insight', body: 'What we saw and why it matters.' };
      case 'rec': return { priority: 'Medium', title: 'New recommendation', detail: 'What to change.', owner: 'Team', effort: 'Small', evidence: [] };
      case 'quote': return { who: P0, text: 'Quote' };
      case 'look': return { text: 'What to look for', observed: true };
      case 'link': return { label: 'New link', url: 'https://' };
      case 'finding': {
        const t = get(arrPath.replace(/\.findings$/, ''));
        const max = Math.max(0, ...t.findings.map(f => +(f.id.match(/F(\d+)$/) || [0, 0])[1]));
        return { id: `${t.id}-F${max + 1}`, type: 'minor', text: 'New finding', who: [] };
      }
      case 'task': { const hi = +arrPath.split('.')[1]; return newTask(hi, get(arrPath).length); }
      case 'hyp': { const n = state.hypotheses.length; return { id: `H${n + 1}`, statement: 'New hypothesis', tasks: [newTask(n, 0)] }; }
      case 'participant': {
        const id = `P${Math.max(0, ...P().map(p => +p.id.replace(/\D/g, '') || 0)) + 1}`;
        state.hypotheses.forEach(h => h.tasks.forEach(t => { t.results[id] = { done: true, sev: 'none', seq: Math.ceil(scale / 2) }; }));
        return { id, ...Object.fromEntries(pFields().map(f => [f.key, ''])) };
      }
    }
  }

  // ---------- edits ----------
  function changed(rerender = true) {
    dirty = true;
    if (rerender) render();
    else { const st = app.querySelector('.editbar .state'); if (st) { st.classList.add('dirty'); st.firstChild.nextSibling.textContent = 'Unsaved changes'; } const sb = app.querySelector('[data-act="save"]'); if (sb) sb.disabled = false; const db = app.querySelector('[data-act="discard"]'); if (db) db.hidden = false; }
  }
  app.addEventListener('input', e => {
    const el = e.target.closest('[data-edit]');
    if (!el || !editing) return;
    const path = el.dataset.edit;
    set(path, el.textContent);
    app.querySelectorAll(`[data-mirror="${path}"], [data-edit="${path}"]`).forEach(m => { if (m !== el) m.textContent = el.textContent; });
    if (path === 'study.title') document.title = docTitle();
    changed(false);
  });
  app.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.closest('[data-edit]')) { e.preventDefault(); e.target.blur(); }
  });
  app.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.set) {
      const k = el.dataset.kind;
      const v = k === 'bool' ? el.checked : k === 'num' ? Number(el.value) : k === 'list' ? el.value.split(',').map(s => s.trim()).filter(Boolean) : el.value;
      if (el.dataset.set.includes('.results.') && get(el.dataset.set.replace(/\.[^.]+$/, '')) == null) set(el.dataset.set.replace(/\.[^.]+$/, ''), { done: false, sev: 'none', seq: Math.ceil(state.study.seqScale / 2) });
      set(el.dataset.set, v);
      return changed(!(el.tagName === 'INPUT' && (el.type === 'text' || !el.type)));
    }
    if (el.dataset.override) {
      const t = get(el.dataset.override);
      if (el.value) t.override = { verdict: el.value, reason: t.override?.reason || '' }; else delete t.override;
      return changed();
    }
    if (el.dataset.img) {
      const f = el.files?.[0]; if (!f) return;
      if (f.size > 3 * 1024 * 1024) return toast('That image is over 3 MB. Use a smaller screenshot so the report stays quick to load.');
      const rd = new FileReader();
      rd.onload = () => { const spec = get(el.dataset.img); spec.src = rd.result; changed(); };
      rd.readAsDataURL(f);
    }
  });

  // ---------- clicks ----------
  let toastTimer;
  function toast(html) {
    document.querySelector('.toast')?.remove();
    const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.innerHTML = html;
    document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 5000);
    return el;
  }
  app.addEventListener('click', e => {
    const t = e.target;
    const fb = t.closest('[data-filter]'); if (fb) { filter = fb.dataset.filter; app.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b === fb))); return applyFilter(); }
    const sb = t.closest('[data-shot]');
    if (sb) {
      const box = sb.closest('.screens');
      box.querySelectorAll('[data-shot]').forEach(b => b.setAttribute('aria-pressed', String(b === sb)));
      box.querySelectorAll('.shot').forEach(f => { f.hidden = f.dataset.v !== sb.dataset.shot; });
      return;
    }
    const zb = t.closest('[data-zoom]');
    const shotEl = !editing && t.closest('.shot svg, .shot img');
    if (zb || shotEl) {
      const art = (zb || shotEl).closest('.task');
      const [hi, ti] = zb ? [+zb.dataset.h, +zb.dataset.zoom] : (() => { for (const [hi, h] of state.hypotheses.entries()) for (const [ti, tk] of h.tasks.entries()) if (slug(tk.id) === art.id) return [hi, ti]; return [0, 0]; })();
      return openZoom(state.hypotheses[hi].tasks[ti]);
    }
    const mb = t.closest('[data-more]');
    if (mb) { mb.parentElement.querySelectorAll('.pid[hidden]').forEach(c => { c.hidden = false; }); mb.remove(); return; }
    const cb = t.closest('[data-copy]');
    if (cb) {
      const url = location.href.split('#')[0] + '#' + cb.dataset.copy;
      const fallback = () => { const el = toast(`Copy this link:<input readonly value="${esc(url)}" aria-label="Link to finding">`); const i = el.querySelector('input'); i.focus(); i.select(); };
      try { navigator.clipboard.writeText(url).then(() => toast('Link to finding copied'), fallback); } catch { fallback(); }
      return;
    }
    const wb = t.closest('[data-who]');
    if (wb) { const f = get(wb.dataset.who), id = wb.dataset.pid; f.who = f.who.includes(id) ? f.who.filter(x => x !== id) : P().map(p => p.id).filter(x => x === id || f.who.includes(x)); return changed(); }
    const ab = t.closest('[data-add]');
    if (ab) { const arr = get(ab.dataset.add); arr.push(template(ab.dataset.tpl, ab.dataset.add)); return changed(); }
    const db = t.closest('[data-del]');
    if (db) {
      const p = db.dataset.del, ks = p.split('.'), idx = +ks.pop(), arr = get(ks.join('.'));
      const removed = arr.splice(idx, 1)[0];
      if (ks.join('.') === 'participants') state.hypotheses.forEach(h => h.tasks.forEach(tk => { delete tk.results[removed.id]; (tk.findings || []).forEach(f => { f.who = f.who.filter(x => x !== removed.id); }); }));
      return changed();
    }
    const scb = t.closest('[data-screens]');
    if (scb) { const tk = get(scb.dataset.screens); tk.screens = { device: 'mobile', asIs: { title: 'Screen', caption: 'Current design', blocks: [{ label: 'Content', h: 60 }, { label: 'Problem area', h: 50, tone: 'hot' }] }, toBe: { title: 'Screen', caption: 'Proposed design', blocks: [{ label: 'Content', h: 60 }, { label: 'Proposed change', h: 50, tone: 'new' }] } }; return changed(); }
    const ub = t.closest('[data-unimg]'); if (ub) { delete get(ub.dataset.unimg).src; return changed(); }
    const act = t.closest('[data-act]')?.dataset.act;
    if (act === 'theme') return toggleTheme();
    if (act === 'edit') { session = editing = true; render(); return toast('Editing. Click any outlined text to change it.'); }
    if (act === 'preview') { return keepPlace(() => { editing = !editing; render(); }); }
    if (act === 'discard') { state = JSON.parse(ORIGINAL); dirty = false; session = editing = false; return render(); }
    if (act === 'save') return save();
    if (act === 'json') return openJson();
    if (act === 'restore') { state = pendingRestore; pendingRestore = null; clearStash(); session = editing = true; dirty = true; return render(); }
    if (act === 'drop') { pendingRestore = null; clearStash(); return render(); }
  });

  // Re-render without losing your place: keep the first visible section or task at the same height on screen.
  function keepPlace(fn) {
    const top = (parseFloat(getComputedStyle(root).getPropertyValue('--bar-h')) || 51) + 8;
    const anchor = [...app.querySelectorAll('.task[id], section[id], .hero')].find(el => el.getBoundingClientRect().bottom > top);
    const id = anchor?.id, before = anchor?.getBoundingClientRect().top;
    fn();
    const el = id && document.getElementById(id);
    if (el) scrollBy(0, el.getBoundingClientRect().top - before);
  }

  function applyFilter() {
    let shown = 0, total = 0;
    app.querySelectorAll('.task').forEach(tk => {
      let n = 0;
      tk.querySelectorAll('.finding').forEach(li => { li.hidden = filter !== 'all' && li.dataset.type !== filter; total++; if (!li.hidden) n++; });
      shown += n;
      const msg = tk.querySelector('.none-msg'); if (msg) msg.hidden = n > 0 || filter === 'all';
    });
    const fc = app.querySelector('.filter-count');
    if (fc) fc.textContent = filter === 'all' ? `${total} findings across ${app.querySelectorAll('.task').length} tasks` : `Showing ${shown} of ${total} findings`;
  }

  function openZoom(t) {
    const dlg = document.getElementById('zoom'), dev = t.screens?.device === 'desktop' ? 'desktop' : 'mobile';
    dlg.innerHTML = `<div class="dlg-head"><h3 id="zoom-title">${esc(t.id)} · As is and to be</h3><button class="btn" type="button" data-close>Close</button></div>
      <div class="dlg-body ${dev === 'desktop' ? 'desk' : ''}">
        ${['asIs', 'toBe'].map(v => `<figure class="shot"><span class="eyebrow">${v === 'asIs' ? 'As is' : 'To be'}</span>${screen(t.screens[v], dev, v)}<figcaption>${esc(t.screens[v].caption)}</figcaption></figure>`).join('')}
      </div>`;
    dlg.showModal();
  }
  document.getElementById('zoom').addEventListener('click', e => { if (e.target.id === 'zoom' || e.target.closest('[data-close]')) e.currentTarget.close(); });

  function openJson() {
    const dlg = document.getElementById('jsonDlg');
    dlg.innerHTML = `<div class="dlg-head"><h3 id="json-title">Edit all report data</h3><button class="btn" type="button" data-close>Cancel</button></div>
      <div style="padding:14px 18px 0;display:grid;gap:8px"><p class="muted" style="font-size:13.5px">Everything in the report comes from this data, including participants, results and screens. Change it here for anything the page doesn't let you edit directly.</p>
      <textarea id="jsonText" spellcheck="false" aria-label="Report data"></textarea></div>
      <div class="dlg-foot"><span class="err" id="jsonErr" role="alert"></span><button class="btn primary" type="button" data-apply>Apply changes</button></div>`;
    dlg.querySelector('#jsonText').value = JSON.stringify(state, null, 2);
    dlg.showModal();
  }
  document.getElementById('jsonDlg').addEventListener('click', e => {
    const dlg = e.currentTarget;
    if (e.target === dlg || e.target.closest('[data-close]')) return dlg.close();
    if (e.target.closest('[data-apply]')) {
      try {
        const next = JSON.parse(dlg.querySelector('#jsonText').value);
        const ok = next?.study?.title != null && Array.isArray(next.participants) && Array.isArray(next.hypotheses) && Array.isArray(next.insights) && Array.isArray(next.recommendations)
          && next.hypotheses.every(h => Array.isArray(h.tasks) && h.tasks.every(t => t.results && t.screens));
        if (!ok) throw new Error('The data needs study, participants, insights, recommendations and hypotheses, and every task needs results and screens.');
        state = next; dlg.close(); changed();
      } catch (err) { dlg.querySelector('#jsonErr').textContent = err instanceof SyntaxError ? `That isn't valid JSON: ${err.message}` : err.message; }
    }
  });

  // ---------- theme ----------
  const root = document.documentElement;
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  function paintThemeBtn() {
    const b = document.getElementById('themeBtn'); if (!b) return;
    const d = isDark();
    b.innerHTML = icon(d ? 'sun' : 'moon');
    b.setAttribute('aria-label', d ? 'Switch to light theme' : 'Switch to dark theme');
    b.title = d ? 'Light theme' : 'Dark theme';
  }
  function toggleTheme() {
    root.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('report-theme', root.dataset.theme); } catch {}
    paintThemeBtn();
  }
  try { const th = localStorage.getItem('report-theme'); if (th === 'light' || th === 'dark') root.dataset.theme = th; } catch {}
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', paintThemeBtn);

  // ---------- sticky offsets ----------
  function measureBar() { const b = app.querySelector('.secbar'); if (b) root.style.setProperty('--bar-h', b.offsetHeight + 'px'); }
  addEventListener('resize', measureBar);

  // ---------- saving ----------
  const RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  const FONTS = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">';
  const DATA_NOTE = '<!' + '-- STUDY DATA. Editors can change everything in the page itself (Edit report). This block is what gets saved. --' + '>';
  function buildHTML() {
    const css = document.getElementById('page-style').textContent;
    const brandCss = document.getElementById('brand-style')?.textContent || '';
    const fontLink = document.getElementById('brand-fonts');
    const fonts = fontLink ? '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' + fontLink.outerHTML : FONTS;
    const js = document.getElementById('page-script').textContent;
    const sprite = document.getElementById('sprite').outerHTML;
    const data = JSON.stringify(state, null, 2).replace(/</g, '\\u003c');
    return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${RESET}</style></head><body>`
      + `<meta charset="utf-8">\n<title>${esc(docTitle())}</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n${fonts}\n<style id="page-style">${css}</style>\n<style id="brand-style">${brandCss}</style>\n${sprite}\n`
      + `<div id="app"></div>\n<dialog id="zoom" aria-labelledby="zoom-title"></dialog>\n<dialog id="jsonDlg" aria-labelledby="json-title"></dialog>\n${DATA_NOTE}\n`
      + `<script type="application/json" id="study-data">\n${data}\n<\/script>\n<script id="page-script">${js}<\/script>\n</body></html>`;
  }
  const STASH = 'report-pending-save';
  const clearStash = () => { try { sessionStorage.removeItem(STASH); } catch {} };
  async function save() {
    if (saving) return;
    if (!dirty) { session = editing = false; return render(); }
    if (editAccess === 'local') {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buildHTML()], { type: 'text/html' }));
      a.download = `${slug(state.study.title)}-${state.study.date}.html`;
      document.body.appendChild(a); a.click(); a.remove();
      dirty = false; session = editing = false; render(); return toast('Saved. The updated report is in your Downloads folder.');
    }
    saving = true; render();
    try { sessionStorage.setItem(STASH, JSON.stringify(state)); } catch {}
    const attempt = () => artifactApi.publish(buildHTML());
    try {
      await attempt().catch(async err => { if (err?.code === 'upstream_error') { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); return attempt(); } throw err; });
      toast('Saved. Loading the new version…');
    } catch (err) {
      saving = false;
      const code = err?.code;
      if (code === 'conflict') { toast('Someone saved a newer version. Loading it now; your edits are kept in this browser so you can restore them.'); return; }
      clearStash();
      if (['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'].includes(code)) { editAccess = null; session = editing = false; render(); return toast('This view is read-only, so changes can’t be saved here. Ask the report owner for edit access.'); }
      render();
      if (code === 'too_large') return toast('The report is too large to save. Replace big screenshots with smaller images and try again.');
      if (code === 'rate_limited') return toast('Saving too often. Wait a moment, then save again.');
      toast('Couldn’t save just now. Your changes are still here; try again in a moment.');
    }
  }
  addEventListener('beforeunload', e => { if (dirty && !saving) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- hash reveal ----------
  function reveal() {
    const id = location.hash.slice(1); if (!id) return;
    const el = document.getElementById(id); if (!el) return;
    if (el.hidden) { filter = 'all'; app.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === 'all'))); applyFilter(); }
    if (id === 'top') return scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
    el.scrollIntoView({ block: el.classList.contains('finding') ? 'center' : 'start', behavior: reduceMotion() ? 'auto' : 'smooth' });
    if (el.classList.contains('finding')) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }
  addEventListener('hashchange', reveal);
  addEventListener('beforeprint', () => document.querySelectorAll('details').forEach(d => d.open = true));

  // ---------- boot ----------
  try { const s = sessionStorage.getItem(STASH); if (s) { if (s !== JSON.stringify(state)) pendingRestore = JSON.parse(s); else sessionStorage.removeItem(STASH); } } catch {}
  render();
  reveal();
  (async () => {
    if (window.claude?.use) {
      const [art, user] = await Promise.all([window.claude.use('artifact'), window.claude.use('user')]);
      if (!art) return;
      const can = user ? await user.canEdit() : false;
      if (can) { artifactApi = art; editAccess = 'artifact'; render(); }
    } else if (location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname)) {
      editAccess = 'local'; render();
    }
  })();
})();
</script>
