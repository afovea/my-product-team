<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--CSP-->
<title>{{TITLE}}</title>
<!--FONTS-->
<style id="base-style">
/* Shared shell for research tools. Tokens match research-reporter, so a brand profile themes tools and reports alike.
   Layout: one centred column; sticky moderator header; participant screens are single cards; task material sits on its own stage. */
:root {
  --bg: #F5F6FA; --surface: #FFFFFF; --ink: #1B1E2E; --muted: #5B6077; --line: #DCDFEA;
  --accent: #3A3FB0; --accent-soft: #E6E7F8;
  --pass: #1D7A4C; --pass-soft: #DFF2E6; --minor: #9A5800; --minor-soft: #FBEED6;
  --major: #B02525; --major-soft: #FBE2E0; --inv: #565B85; --inv-soft: #E8E9F3;
  --stage: #EEF0F6;
  --f-display: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11131D; --surface: #1A1D2B; --ink: #E8EAF4; --muted: #A1A5BD; --line: #2D3146;
  --accent: #A4A8FF; --accent-soft: #272B4C;
  --pass: #64CF95; --pass-soft: #163024; --minor: #F2B458; --minor-soft: #352812;
  --major: #FF8E84; --major-soft: #3B1B1B; --inv: #B8BBDB; --inv-soft: #24273B; --stage: #151824;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #11131D; --surface: #1A1D2B; --ink: #E8EAF4; --muted: #A1A5BD; --line: #2D3146;
  --accent: #A4A8FF; --accent-soft: #272B4C;
  --pass: #64CF95; --pass-soft: #163024; --minor: #F2B458; --minor-soft: #352812;
  --major: #FF8E84; --major-soft: #3B1B1B; --inv: #B8BBDB; --inv-soft: #24273B; --stage: #151824;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--f-body); min-height: 100vh; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(24px, 4vw, 32px); }
h2 { font-size: 20px; }
h3 { font-size: 16px; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 20px; }
.wrap.wide { max-width: 1180px; }

/* Header */
.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .bar { max-width: 1180px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 12px; min-height: 52px; }
.top .title { font: 600 15px/1.2 var(--f-display); display: flex; align-items: center; gap: 8px; min-width: 0; }
.top .title img { height: 24px; width: auto; }
.top .title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top nav { display: flex; gap: 2px; margin-left: 8px; }
.top nav button { border: 0; background: none; padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; cursor: pointer; min-height: 40px; }
.top nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.top .spacer { flex: 1; }
.save { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.save .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); }
.save.bad { color: var(--major); font-weight: 600; } .save.bad .dot { background: var(--major); }
.save.warn .dot { background: var(--minor); }
.progress { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.progress .track { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress .track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .2s; }

/* Cards and controls */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 16px; }
.audience { font: 600 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 17px; color: var(--muted); max-width: 62ch; }
.body-copy { max-width: 62ch; white-space: pre-line; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.quiet { border-color: transparent; background: none; color: var(--muted); }
.btn.danger { color: var(--major); border-color: var(--major); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn .key { font: 500 11px/1 var(--f-mono); padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .7; }
.field { display: grid; gap: 6px; }
.field label, .field .label { font-weight: 600; }
.field .hint { font-size: 14px; color: var(--muted); }
.input, textarea.input, select.input { min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); width: 100%; }
textarea.input { min-height: 96px; resize: vertical; }
.input[aria-invalid="true"] { border-color: var(--major); }
.error { color: var(--major); font-size: 14px; font-weight: 500; }
.note { border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.note.warn { background: var(--minor-soft); color: var(--ink); }
.note.bad { background: var(--major-soft); color: var(--ink); }
.note.info { background: var(--accent-soft); color: var(--ink); }
.check { display: flex; gap: 10px; align-items: flex-start; min-height: 44px; }
.check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); flex: none; }

/* Scales: a labelled radio group, every point named */
.scale { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
.scale legend { font-weight: 600; padding: 0; margin-bottom: 4px; }
.scale .points { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 8px; }
.scale .points label { display: grid; justify-items: center; gap: 6px; padding: 10px 6px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; text-align: center; font-size: 13px; min-height: 44px; }
.scale .points input { position: absolute; opacity: 0; pointer-events: none; }
.scale .points b { font: 600 18px/1 var(--f-display); }
.scale .points input:checked + span { color: var(--accent); }
.scale .points label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.scale .points label:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 520px) { .scale .points { grid-template-columns: 1fr; } .scale .points label { grid-template-columns: 28px 1fr; justify-items: start; text-align: left; } }

/* Rank question */
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rank li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.rank .pos { font: 600 13px/28px var(--f-mono); text-align: center; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.rank .mv { display: flex; gap: 4px; }
.rank .mv button { min-width: 44px; min-height: 40px; }

/* Task stage: test material is visibly apart from the tool */
.task-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.task-bar .scenario { font-weight: 600; max-width: 70ch; }
.stage { background: var(--stage); border: 2px dashed var(--line); border-radius: 16px; padding: 16px; min-height: 240px; }
.stage-label { font: 600 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

/* Moderator tables and figures */
.table-box { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 12px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--bg); }
tr:last-child td { border-bottom: 0; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.badge.ok { background: var(--pass-soft); color: var(--pass); border-color: transparent; }
.badge.warn { background: var(--minor-soft); color: var(--minor); border-color: transparent; }
.badge.bad { background: var(--major-soft); color: var(--major); border-color: transparent; }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.figure { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.figure b { font: 700 22px/1.1 var(--f-display); }
.figure span { font-size: 13px; color: var(--muted); }
.code { font-family: var(--f-mono); font-size: 13px; }

/* Dialogs */
.overlay { position: fixed; inset: 0; background: rgb(10 12 20 / .55); display: grid; place-items: center; padding: 16px; z-index: 40; }
.dialog { background: var(--surface); color: var(--ink); border-radius: 14px; padding: 22px; max-width: 520px; width: 100%; display: grid; gap: 14px; box-shadow: 0 20px 60px rgb(0 0 0 / .25); }
.kbd { font: 500 12px/1 var(--f-mono); padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); }
.shortcuts { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
@media print { .top, .actions { display: none; } }
</style>
<style id="brand-style">{{BRAND_CSS}}</style>
<style id="method-style">{{METHOD_CSS}}</style>
</head>
<body>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="app"></div>
<div id="overlay"></div>
<script type="application/json" id="tool-config">{{CONFIG}}</script>
<script type="application/json" id="study-content">{{CONTENT}}</script>
<script id="shell">
/* Research tool shell. One state, one dispatch, one render. Method modules register with Shell.register(). */
(function () {
  'use strict';
  var CONFIG = JSON.parse(document.getElementById('tool-config').textContent);
  var EMBEDDED = JSON.parse(document.getElementById('study-content').textContent);
  var FORMAT = 'research-sessions', FORMAT_VERSION = 1;
  var EASE = ['Very difficult', 'Difficult', 'Neither easy nor difficult', 'Easy', 'Very easy'];
  var CONFIDENCE = ['Not at all confident', 'Slightly confident', 'Moderately confident', 'Very confident', 'Completely confident'];
  var CODE_RE = /^[A-Za-z]{1,3}\d{1,4}$/;
  var EVENT_CAP = 1000;
  // Who is at the screen. A participant copy is always the participant. On a shared link one page serves both:
  // the link's owner and editors get the moderator screens, everyone else the participant screens.
  var PARTICIPANT = CONFIG.build === 'participant';
  // The test setup the user chose (see references/foundations.md, section 9). Older builds have none.
  var SETUP = CONFIG.setup || { facilitation: PARTICIPANT ? 'self-run' : 'in-person', device: PARTICIPANT ? 'participant' : 'moderator' };
  var MODES = { 'in-person': 'Moderated in person', remote: 'Moderated remotely', 'self-run': 'Participant alone' };
  var method = null;

  // ---------------------------------------------------------------- helpers
  function el(tag, attrs) {
    var n = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
    for (var k in (attrs || {})) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if ((k === 'disabled' || k === 'checked' || k === 'selected' || k === 'required') && !v) continue; // 0 and '' mean off, not on
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else if (k === 'style') n.setAttribute('style', v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    kids.forEach(function add(c) { if (c == null || c === false) return; if (Array.isArray(c)) return c.forEach(add); n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function now() { return Date.now(); }
  function iso(ms) { return ms == null ? null : new Date(ms).toISOString(); }
  function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 8) + now().toString(36).slice(-4); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function median(xs) { if (!xs.length) return null; var s = xs.slice().sort(function (a, b) { return a - b; }), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
  function fmtMs(ms) { if (ms == null) return '–'; var s = Math.round(ms / 1000); return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's'; }
  function fnv(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(list, rand) { var a = list.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function sha256(text) {
    if (!(window.crypto && crypto.subtle)) return Promise.resolve(null);
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (b) { return Array.prototype.map.call(new Uint8Array(b), function (x) { return x.toString(16).padStart(2, '0'); }).join(''); });
  }
  function contentHash(c) { return fnv(JSON.stringify(c)).toString(16).padStart(8, '0'); }
  function announce(msg) { var live = document.getElementById('live'); live.textContent = ''; setTimeout(function () { live.textContent = msg; }, 30); }
  function today() { return new Date().toISOString().slice(0, 10); }

  // ---------------------------------------------------------------- state
  var S = {
    content: null, hash: null, contents: {}, contentErrors: [], contentWarnings: [],
    view: 'session', step: 'setup', sessions: {}, session: null, cur: null,
    confirm: null, dialog: null, save: { mode: 'memory', ok: true, at: null, message: '' },
    form: {}, lastStep: null, tour: null, fileMessage: ''
  };

  // Moves between steps that are allowed. Anything else is refused.
  var NEXT = {
    setup: ['handoff-in', 'consent'], 'handoff-in': ['consent'], consent: ['brief', 'thanks'], brief: ['intro', 'thanks'],
    // A task that asks nothing afterwards skips rating, so active can lead straight to the next task or the closing questions.
    intro: ['active', 'thanks'], active: ['rating', 'intro', 'closing', 'thanks'], rating: ['intro', 'closing', 'thanks'], closing: ['thanks'],
    thanks: ['handoff-out', 'debrief', 'setup'], 'handoff-out': ['debrief'], debrief: ['setup'], withdrawn: ['setup']
  };
  var PARTICIPANT_STEPS = { consent: 1, brief: 1, intro: 1, active: 1, rating: 1, closing: 1, thanks: 1, withdrawn: 1 };
  // A moderator-led method (observation) keeps the device with the moderator: no hand-over, and the
  // moderator reads the participant screens out. Only on a moderator copy.
  function led() { return !PARTICIPANT && !!(method && method.moderatorLed && method.moderatorLed(S.content)); }
  // Hand-over screens only when the device passes between people in the same room.
  function handsOver(s) { return !PARTICIPANT && !led() && s.mode !== 'remote'; }
  function audience() { return led() ? 'Moderator, with the participant' : 'Participant'; }

  function move(to) {
    if (to !== 'setup' && (NEXT[S.step] || []).indexOf(to) < 0) throw new Error('Not allowed: ' + S.step + ' → ' + to);
    S.step = to; S.confirm = null;
    if (S.session) { S.session.current = { step: to, task: S.cur ? S.cur.index : null, taskState: S.cur ? S.cur.state : null, run: S.cur ? S.cur.run : null }; }
  }

  // ---------------------------------------------------------------- content
  function validateContent(c) {
    var errors = [], warnings = [];
    if (!c || typeof c !== 'object') return { errors: ['Content is not an object.'], warnings: [] };
    ['studyId', 'title'].forEach(function (k) { if (!c[k]) errors.push('Missing "' + k + '".'); });
    if (c.studyId && !/^[a-z0-9-]{2,60}$/.test(c.studyId)) errors.push('"studyId" must be lower-case letters, digits and hyphens.');
    if (!Array.isArray(c.tasks) || !c.tasks.length) errors.push('Add at least one task.');
    var ids = {};
    (c.tasks || []).forEach(function (t, i) {
      if (!t.id) errors.push('Task ' + (i + 1) + ' has no id.'); else if (ids[t.id]) errors.push('Task id "' + t.id + '" is used twice.'); else ids[t.id] = 1;
      if (!t.title) errors.push('Task "' + (t.id || i + 1) + '" has no title.');
      if (t.hypothesis && !(c.hypotheses || []).some(function (h) { return h.id === t.hypothesis; })) errors.push('Task "' + t.id + '" refers to hypothesis "' + t.hypothesis + '", which is not listed.');
    });
    (c.hypotheses || []).forEach(function (h) { if (!h.statement) errors.push('Hypothesis "' + h.id + '" has no wording.'); });
    if (!c.consent || !c.consent.text || !Array.isArray(c.consent.items) || !c.consent.items.length) errors.push('Add a consent notice with at least one item.');
    function checkQuestions(qs, where) {
      var seen = {};
      (qs || []).forEach(function (q) {
        if (!q.id || !q.prompt) errors.push('Every ' + where + ' question needs an id and a prompt.');
        else if (seen[q.id]) errors.push(where + ' question id "' + q.id + '" is used twice.'); else seen[q.id] = 1;
        if (['choice', 'choices', 'rank', 'text', 'scale'].indexOf(q.kind) < 0) errors.push(where + ' question "' + q.id + '" has an unknown kind "' + q.kind + '".');
        if ((q.kind === 'choice' || q.kind === 'choices' || q.kind === 'rank') && !((q.options || q.items || []).length >= 2)) errors.push(where + ' question "' + q.id + '" needs at least two options.');
        if (q.kind === 'scale' && !((q.labels || []).length >= 2)) errors.push(where + ' question "' + q.id + '" needs its scale labels.');
      });
    }
    checkQuestions(c.closing, 'Closing');
    (c.tasks || []).forEach(function (t) { checkQuestions(t.questions, 'Task ' + t.id); });
    var codeIds = {};
    (c.codes || []).forEach(function (k) { if (!k.id || !k.label) errors.push('Every observation code needs an id and a label.'); else if (codeIds[k.id]) errors.push('Observation code "' + k.id + '" is used twice.'); else codeIds[k.id] = 1; });
    if (c.repeat && !(c.repeat.entries >= 2)) errors.push('"repeat.entries" must be 2 or more: the number of sessions each participant does.');
    Object.keys(c.fixedOrders || {}).forEach(function (code) { (c.fixedOrders[code] || []).forEach(function (id) { if (!ids[id]) errors.push('Fixed order for ' + code + ' names unknown task "' + id + '".'); }); });
    if (method && method.validate) { var r = method.validate(c); errors = errors.concat(r.errors || []); warnings = warnings.concat(r.warnings || []); }
    if ((c.tasks || []).length > 12) warnings.push('More than 12 tasks: sessions may run long and later tasks suffer from fatigue.');
    return { errors: errors, warnings: warnings };
  }
  function useContent(c) {
    var v = validateContent(c);
    S.content = c; S.hash = contentHash(c); S.contents[S.hash] = c; S.contentErrors = v.errors; S.contentWarnings = v.warnings;
  }

  // ---------------------------------------------------------------- storage
  // Delivery decides storage: shared-link uses the page's shared store, everything else the device.
  var Store = (function () {
    // Shared layout: sessions/<person>/s/<session>, plus a marker doc sessions/<person> so moderators can list people.
    // The link's rules let each person read and write only their own subtree, and editors read and review them all.
    // A participant copy keeps its own sessions apart, so a pilot on the moderator's device never mixes the two copies.
    var mem = {}, db = null, me = null, owner = {}, prefix = function () { return 'rt:' + S.content.studyId + (CONFIG.build === 'participant' ? ':p' : '') + ':'; };
    function path(id) { return 'sessions/' + (owner[id] || me) + '/s/' + id; }
    function localOk() { try { var k = '__rt_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } }
    return {
      init: function (userId) {
        var wantShared = CONFIG.delivery === 'shared-link' && window.claude && window.claude.use && userId;
        var p = wantShared ? window.claude.use('db').catch(function () { return null; }) : Promise.resolve(null);
        me = userId || null;
        return p.then(function (d) {
          db = d;
          S.save.mode = db ? 'shared' : localOk() ? 'device' : 'memory';
          if (wantShared && !db) S.save.message = 'Shared storage is not available here, so sessions are saved on this device only.';
          if (S.save.mode === 'memory') { S.save.ok = false; S.save.message = 'This browser is not letting the tool save. Export each session before closing the page.'; }
        });
      },
      loadAll: function () {
        if (db) {
          var people = PARTICIPANT ? Promise.resolve([me]) : db.collection('sessions').limit(1000).get().then(function (snap) { return snap.docs.map(function (d) { return d.id; }); });
