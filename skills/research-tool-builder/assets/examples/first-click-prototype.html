<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Example shop prototype</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d1d1f; background: #fff; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #ddd; }
  nav a, header a { color: inherit; text-decoration: none; margin-right: 16px; }
  .brand { font-weight: 700; font-size: 20px; }
  .banner { margin: 24px; padding: 32px; border-radius: 12px; background: #f4ecd9; display: block; color: inherit; text-decoration: none; }
  .banner b { font-size: 28px; display: block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 0 24px; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; min-height: 120px; }
  footer { margin-top: 32px; padding: 24px; border-top: 1px solid #ddd; display: flex; gap: 24px; flex-wrap: wrap; }
  form { display: flex; gap: 6px; }
  input { padding: 6px 8px; }
</style></head>
<body>
<header>
  <a class="brand" href="#home" data-zone="logo">Example Shop</a>
  <nav><a href="#women" data-zone="nav-women">Women</a><a href="#men" data-zone="nav-men">Men</a><a href="#home-goods" data-zone="nav-home">Home</a><a href="#sale" data-zone="nav-sale">Sale</a></nav>
  <form data-zone="search" role="search"><input type="search" name="q" aria-label="Search"><button>Search</button></form>
  <div><a href="#orders" data-zone="header-orders">Your orders</a><a href="#account" data-zone="header-account">Account</a><a href="#basket" data-zone="basket">Basket</a></div>
</header>
<a class="banner" href="#sale" data-zone="sale-banner"><b>Up to 40% off</b>Selected lighting and textiles, this week only</a>
<section class="grid" data-zone="products">
  <div class="card">Linen cushion</div><div class="card">Brass lamp</div><div class="card">Wool throw</div><div class="card">Ceramic vase</div>
</section>
<footer><a href="#help" data-zone="footer-help">Help and contact</a><a href="#returns" data-zone="footer-returns">Returns</a><a href="#about" data-zone="footer-about">About us</a></footer>
</body></html>
